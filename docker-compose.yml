services:
  ai:
    build:
      context: ./AI
      dockerfile: Dockerfile
    container_name: deeptier-ai
    env_file:
      - path: ./.env.ai
        required: false
    environment:
      PORT: 8000
      DEEPTIER_BACKEND_URL: http://dt-backend:8080
    ports:
      - "8000:8000"
    volumes:
      - ai_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - deeptier-net

  dt-backend:
    build:
      context: ./dt-backend
      dockerfile: Dockerfile
    container_name: deeptier-backend
    env_file:
      - path: ./.env.bk
        required: false
    depends_on:
      ai:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: hana
      DEEPTIER_PYTHON_URL: http://ai:8000
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$${SERVER_PORT:-8080}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - deeptier-net

volumes:
  ai_data:

networks:
  deeptier-net:
    driver: bridge
